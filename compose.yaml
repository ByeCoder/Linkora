services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
    volumes:
      - bot_data:/app/data
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "bot.health"]
      interval: 60s
      timeout: 5s
      start_period: 70s
      retries: 3
volumes:
  bot_data:
